name: tihbc-donor-recall

x-backend-service: &backend-service
  image: tihbc-donor-recall-backend:latest
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - .env.production
  volumes:
    - tihbc_media_data:/data/media
  restart: unless-stopped
  networks:
    - tihbc-internal

services:
  tihbc-web:
    image: tihbc-donor-recall-web:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://tihbc.kanwalkumar.com/api/v1
        NEXT_PUBLIC_WS_URL: wss://tihbc.kanwalkumar.com/ws
        NEXT_PUBLIC_APP_NAME: TIHBC Donor Recall
        NEXT_PUBLIC_DEMO_MODE: "true"
        NEXT_PUBLIC_SIMULATOR_SOURCE: api
        NEXT_PUBLIC_REALTIME: "on"
    environment:
      NEXT_PUBLIC_API_URL: https://tihbc.kanwalkumar.com/api/v1
      NEXT_PUBLIC_WS_URL: wss://tihbc.kanwalkumar.com/ws
      NEXT_PUBLIC_APP_NAME: TIHBC Donor Recall
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_SIMULATOR_SOURCE: api
      NEXT_PUBLIC_REALTIME: "on"
    depends_on:
      tihbc-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      tihbc-internal:
      proxy:
        aliases:
          - tihbc-web
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  tihbc-api:
    <<: *backend-service
    environment:
      RUN_MIGRATIONS: "true"
    depends_on:
      tihbc-db:
        condition: service_healthy
      tihbc-redis:
        condition: service_healthy
    networks:
      tihbc-internal:
      proxy:
        aliases:
          - tihbc-api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  tihbc-worker:
    <<: *backend-service
    environment:
      RUN_MIGRATIONS: "false"
    command: ["python", "-m", "app.scheduler"]
    depends_on:
      tihbc-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  tihbc-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tihbc}
      POSTGRES_USER: ${POSTGRES_USER:-tihbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_POSTGRES_PASSWORD}
    volumes:
      - tihbc_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - tihbc-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  tihbc-redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tihbc_redis_data:/data
    restart: unless-stopped
    networks:
      - tihbc-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  tihbc-internal:
    internal: true
  proxy:
    external: true
    name: proxy

volumes:
  tihbc_media_data:
  tihbc_postgres_data:
  tihbc_redis_data:
