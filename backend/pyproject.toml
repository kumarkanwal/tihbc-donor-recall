[project]
name = "tihbc-donor-recall-backend"
version = "0.1.0"
description = "Backend for the TIHBC donor recall demo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.3,<3",
    "phonenumbers>=9,<10",
    "PyJWT>=2.9,<3",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25,<26",
    "uvicorn[standard]>=0.35,<1",
    "langgraph>=0.6,<2",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "langchain-google-genai>=2,<5",
    "langchain-mistralai>=0.2,<2",
    "langsmith>=0.4,<1",
    "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pandas-stubs>=2.3,<3",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
    "types-openpyxl>=3.1,<4",
]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
asyncio_mode = "auto"
markers = [
    "postgres: requires --run-postgres and a reachable PostgreSQL server",
    "redis: requires --run-redis and a reachable Redis server",
]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".pytest_tmp", ".pytest_tmp_codex"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
